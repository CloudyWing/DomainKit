name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: windows-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DomainKit.slnx

      - name: Build
        run: dotnet build DomainKit.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test DomainKit.slnx --configuration Release --no-build

  create-release:
    needs: verify
    permissions:
      contents: write
    uses: CloudyWing/devops-templates/.github/workflows/reusable-create-release.yml@main
    with:
      changelog-path: "CHANGELOG.md"

  # publish-nuget 與 probe 以 composite action 執行發佈步驟，不使用 reusable
  # workflow。nuget.org 的 Trusted Publishing 驗證 OIDC token 的
  # job_workflow_ref claim，要求前綴為 CloudyWing/DomainKit/.github/workflows/。
  # reusable workflow 會使該 claim 指向 devops-templates 而驗證失敗。
  publish-nuget:
    needs: create-release
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Pack and publish
        uses: CloudyWing/devops-templates/.github/actions/nuget-publish@main
        with:
          nuget-user: CloudyWing

  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify Trusted Publishing binding
        uses: CloudyWing/devops-templates/.github/actions/nuget-publish@main
        with:
          nuget-user: CloudyWing
          dry-run: 'true'
