name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DomainKit.slnx

      - name: Build
        run: dotnet build DomainKit.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test DomainKit.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack DomainKit.slnx --configuration Release --no-build
